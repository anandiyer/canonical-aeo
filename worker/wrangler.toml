name = "canonical-aeo"
main = "src/worker.js"
compatibility_date = "2026-05-01"
workers_dev = true

# Custom domain on the canonical.cc zone. A hostname belongs to exactly one
# Worker, so this lab gets its own subdomain rather than sharing
# labs-api.canonical.cc with `lookalike` — an AEO run makes ~60 external calls,
# and a runaway here must not be able to take the Lookalike Finder down with it.
# wrangler provisions the DNS record + TLS cert on first deploy.
[[routes]]
pattern = "aeo-api.canonical.cc"
custom_domain = true

[vars]
ALLOWED_ORIGIN = "https://canonical.cc,https://www.canonical.cc"
# Per-DOMAIN fresh scans per UTC day — the limit users actually feel. Cached
# reads are free and unlimited, so sharing or revisiting a report never counts.
DOMAIN_DAILY_LIMIT = "3"

# Per-IP backstop. Deliberately looser than the domain limit: a purely
# per-domain cap would let one caller scan unlimited *different* domains, which
# is unbounded spend. MAX_PAID_RUNS_PER_DAY below is the real cost ceiling.
DAILY_LIMIT = "15"
# Hybrid models via OpenRouter, same convention as canonical-lookalike.
#   CHEAP  → query generation + answer parsing
#   STRONG → content-shape analysis + fix artifacts
MODEL_CHEAP = "google/gemini-3.5-flash"
MODEL_STRONG = "anthropic/claude-sonnet-5"

# Answer engines for Pillar E. FOUR, not five — see ENGINE NOTES below.
ENGINE_CHATGPT = "openai/gpt-5.6-luna"
ENGINE_CLAUDE = "anthropic/claude-sonnet-5"
ENGINE_PERPLEXITY = "perplexity/sonar"
ENGINE_GROK = "x-ai/grok-4.3"

# Gemini goes direct to Google, NOT through OpenRouter, which silently drops
# Google's grounding tool (verified across five request shapes — all returned
# 200 with zero citations). Active only when GEMINI_API_KEY is set, and that key
# must have BILLING ENABLED: grounding with Google Search is not offered on the
# free tier at all, and a free key returns 429 for a grounded call while
# answering an ungrounded one normally.
# Gemini 3.x includes 5,000 grounded searches/month, then $14/1,000.
ENGINE_GEMINI = "gemini-3.5-flash"

# Gemini's own token budget — deliberately NOT ENGINE_MAX_TOKENS. The two
# providers fail in opposite directions at low limits: below ~900 the
# OpenRouter engines silently stop searching, while Gemini below ~4000
# truncates and drops groundingMetadata altogether (finishReason MAX_TOKENS),
# which reads identically to "answered from memory". Verified: 900 → no
# grounding, 4000 → STOP with 18 grounding chunks.
GEMINI_MAX_TOKENS = "4000"

# Measured cost per engine call on a real buyer query (2026-08-08):
#   perplexity/sonar     $0.0052   10 citations
#   openai/gpt-5.6-luna  $0.0122    3 citations
#   x-ai/grok-4.3        $0.0259    3 citations
#   anthropic/sonnet-5   $0.0690    5 citations
# → $0.112/query → ~$1.35 per 12-query run. Within the PRD's $0.75–1.65.

# ENGINE NOTES — all three verified empirically, none of them documented:
#
# 1. GEMINI IS EXCLUDED. It returns zero citations through OpenRouter in every
#    configuration tried (native plugin, no plugin, 3.5-flash and 3.6-flash).
#    It answers from parametric memory, not retrieval. Including it would mean
#    shipping a column that cannot cite — and per the PRD, a missing column
#    beats a fake one. Revisit if OpenRouter adds Google grounding.
#
# 2. PERPLEXITY MUST NOT GET THE WEB PLUGIN. Sonar 404s on engine:"native"
#    ("does not support native web search") because search is intrinsic to the
#    model. Passing no plugin yields 10 citations. Every other engine REQUIRES
#    plugins:[{id:"web", engine:"native"}].
#
# 3. MAX_TOKENS BELOW ~900 SILENTLY SUPPRESSES SEARCH. At 500 tokens
#    gpt-5.6-luna returned 0 citations and a 162-char answer from memory; at
#    900 it returned 3 citations and 1817 chars. A cheap-looking config would
#    produce a tool that works and reports fiction. Do not lower this.
ENGINE_MAX_TOKENS = "900"

# Global paid-scan ceiling per UTC day, across all callers. Per-IP limits cap
# one abuser, not a distributed one, and this endpoint is reachable by curl
# regardless of ALLOWED_ORIGIN. At ~$1.50 a run this bounds the worst case to
# roughly $75/day. Past the cap, scans still run and still return the full
# deterministic audit — only the paid engine half is skipped.
MAX_PAID_RUNS_PER_DAY = "50"

# Cloudflare subrequest ceiling per Worker invocation: 50 on the free plan,
# 1000 on Workers Paid. The crawl spends ~20, leaving ~23 for engine calls —
# about 5 questions each across 4 engines. Exceeding it does not error the run,
# it kills later subrequests outright, which silently cost us a whole engine.
#
# RAISE THIS TO ~950 ON WORKERS PAID ($5/mo) to get the full 12 questions.
SUBREQUEST_BUDGET = "45"

# Per-IP daily rate limiting.
# Named AEO_RL, not RL: a namespace called plain "RL" already exists and belongs
# to canonical-lookalike. Sharing it would couple the two labs' storage, which
# is the opposite of why this lab got its own Worker.
[[kv_namespaces]]
binding = "RL"
id = "41510ec46e084e90aba220a5e90cda7c"

# Report cache, keyed by domain, 7-day TTL. Kept separate from RL because the
# TTLs differ by an order of magnitude and clearing one must not clear the other.
[[kv_namespaces]]
binding = "CACHE"
id = "1191019be90b428aa33b222c257239e4"
